<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>hajeer for PlayStation - 13.20-13.52</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .slideshow-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }
        .slideshow-bg img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slideshow-bg img.active { opacity: 1; }
        .slideshow-bg::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.75);
            z-index: 1;
        }
        body {
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            position: relative;
            z-index: 1;
        }
        .gradient-wrap {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: linear-gradient(135deg, #00ff88 0%, #00d2ff 50%, #8844ee 100%);
            padding: 3px;
            border-radius: 22px;
            position: relative;
            z-index: 2;
        }
        .container {
            background: rgba(9, 19, 34, 0.85);
            border-radius: 20px;
            padding: 30px 25px;
            backdrop-filter: blur(6px);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #1e3a5f;
            padding-bottom: 18px;
            margin-bottom: 30px;
        }
        .store-name { color: #ffffff; font-size: 22px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .bolt { color: #00ffcc; font-size: 22px; }
        .subtitle { font-size: 15px; color: #00d2ff; font-weight: bold; letter-spacing: 2px; margin: 3px 0 6px 0; }
        .phone { font-size: 13px; color: #8899aa; letter-spacing: 1px; }
        .badges { display: flex; gap: 6px; align-items: flex-start; margin-top: 4px; }
        .badge-hack { background: #5b1f8a; color: #ffffff; padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; }
        .badge-ver { background: #0d2a4a; color: #00d2ff; padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; border: 1px solid #00d2ff; }

        /* Spinner */
        #spin {
            width: 50px; height: 50px;
            border: 4px solid #1e3a5f;
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* State messages */
        #state {
            font-size: 20px;
            font-weight: 700;
            margin: 10px 0 6px;
            color: #d8c07f;
        }
        #state.ok { color: #7fd0a0; }
        #state.bad { color: #d08a7f; }
        #state.warn { color: #d8c07f; }

        #det { font-size: 13px; color: #8b95a3; margin: 0 0 4px; }
        #det b { color: #c8ced8; font-weight: 600; }

        #cache {
            font-size: 12px;
            color: #5c6672;
            margin: 0 0 10px;
            min-height: 14px;
        }
        #cache.cacheok { color: #7fd0a0; }

        /* Log output */
        #out {
            display: none;
            white-space: pre-wrap;
            font: 12px/1.45 Consolas, monospace;
            background: #11151b;
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            padding: 10px 12px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            margin-top: 10px;
        }
        body.log #out { display: block; }

        .ok { color: #7fd0a0; }
        .bad { color: #d08a7f; }
        .warn { color: #d8c07f; }
        .safe { color: #7fd0a0; }
        .danger { color: #d08a7f; }
        code { color: #9fb3d0; }

        body.done #spin { display: none; }
        body.fail #spin { display: none; }
    </style>
</head>
<body>
<div class="slideshow-bg">
    <img src="ran/images (45).jpeg" class="active">
    <img src="ran/images (46).jpeg">
    <img src="ran/images (47).jpeg">
    <img src="ran/images (48).jpeg">
    <img src="ran/images (49).jpeg">
    <img src="ran/33f39cad34ac468a040ffed5a43149fb4329ec6c73326838.jpg">
    <img src="ran/1e48e3b7d11fc2da3de62ad8a2a2d3c2882e1bb4ce6caadb.jpg">
</div>

<div class="gradient-wrap">
<div class="container">
    <div class="header">
        <div class="title-box">
            <p class="store-name"><span class="bolt">⚡</span> HAJEER FOR PLAYSTATION</p>
            <p class="subtitle">PS4 JAILBREAK</p>
            <p class="phone">+962798945638</p>
        </div>
        <div class="badges">
            <span class="badge-hack">HACK</span>
            <span class="badge-ver">13.20-13.52</span>
        </div>
    </div>

    <div id="spin"></div>
    <div id="state">جاري التحميل...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="out"></div>

</div>
</div>

<script>
    var images = document.querySelectorAll('.slideshow-bg img');
    var current = 0;
    setInterval(function() {
        images[current].classList.remove('active');
        current = (current + 1) % images.length;
        images[current].classList.add('active');
    }, 2000);
</script>
<script type="module">
    import "./jb.js?v=10";
</script>
</body>
</html>
